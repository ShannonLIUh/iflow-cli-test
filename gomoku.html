<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .current-player {
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 0;
            background-color: #e4b873;
            border: 2px solid #8b4513;
            position: relative;
        }

        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid #8b4513;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .black {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: black;
        }

        .white {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: white;
            border: 1px solid #ccc;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .winner-message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            height: 30px;
        }

        .game-settings {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .game-mode {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ai-difficulty {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .thinking {
            color: #ff9800;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>五子棋游戏</h1>
        
        <div class="game-settings">
            <div class="game-mode">
                <label for="game-mode">游戏模式:</label>
                <select id="game-mode">
                    <option value="pvp">双人对战</option>
                    <option value="ai">人机对战</option>
                </select>
            </div>
            <div class="ai-difficulty">
                <label for="ai-difficulty">AI难度:</label>
                <select id="ai-difficulty">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
        </div>
        
        <div class="game-info">
            <div class="current-player">当前玩家: <span id="current-player">黑子</span></div>
            <div>回合数: <span id="turn-count">0</span></div>
            <div id="ai-thinking" class="thinking"></div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="winner-message" id="winner-message"></div>
        
        <div class="controls">
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        class Gomoku {
            constructor() {
                this.board = Array(15).fill(null).map(() => Array(15).fill(null));
                this.currentPlayer = 'black';
                this.gameOver = false;
                this.turnCount = 0;
                this.gameMode = 'pvp'; // 'pvp' 或 'ai'
                this.aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
                this.aiThinking = false;
                this.initBoard();
                this.initSettings();
            }

            initBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < 15; row++) {
                    for (let col = 0; col < 15; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        cell.addEventListener('click', this.handleCellClick.bind(this));
                        boardElement.appendChild(cell);
                    }
                }
                
                this.updateUI();
            }

            handleCellClick(event) {
                if (this.gameOver || this.aiThinking) return;
                
                const row = parseInt(event.target.dataset.row);
                const col = parseInt(event.target.dataset.col);
                
                if (this.board[row][col] !== null) return;
                
                this.makeMove(row, col);
                
                // 如果是AI模式且轮到AI下棋
                if (this.gameMode === 'ai' && !this.gameOver && this.currentPlayer === 'white') {
                    this.aiMove();
                }
            }
            
            makeMove(row, col) {
                this.board[row][col] = this.currentPlayer;
                this.turnCount++;
                
                // 更新UI
                const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                const piece = document.createElement('div');
                piece.className = this.currentPlayer;
                cellElement.appendChild(piece);
                
                if (this.checkWin(row, col)) {
                    this.gameOver = true;
                    const winner = this.currentPlayer === 'black' ? '黑子' : '白子';
                    document.getElementById('winner-message').textContent = `${winner} 获胜！`;
                } else {
                    this.currentPlayer = this.currentPlayer === 'black' ? 'white' : 'black';
                }
                
                this.updateUI();
            }

            checkWin(row, col) {
                const player = this.board[row][col];
                
                // 检查四个方向：水平、垂直、对角线、反对角线
                const directions = [
                    [[0, 1], [0, -1]],  // 水平
                    [[1, 0], [-1, 0]],  // 垂直
                    [[1, 1], [-1, -1]], // 对角线
                    [[1, -1], [-1, 1]]  // 反对角线
                ];
                
                for (const direction of directions) {
                    let count = 1;
                    
                    for (const [dr, dc] of direction) {
                        let r = row + dr;
                        let c = col + dc;
                        
                        while (r >= 0 && r < 15 && c >= 0 && c < 15 && this.board[r][c] === player) {
                            count++;
                            r += dr;
                            c += dc;
                        }
                    }
                    
                    if (count >= 5) {
                        return true;
                    }
                }
                
                return false;
            }

            updateUI() {
                const currentPlayerElement = document.getElementById('current-player');
                const turnCountElement = document.getElementById('turn-count');
                
                currentPlayerElement.textContent = this.currentPlayer === 'black' ? '黑子' : '白子';
                turnCountElement.textContent = this.turnCount;
            }

            restart() {
                this.board = Array(15).fill(null).map(() => Array(15).fill(null));
                this.currentPlayer = 'black';
                this.gameOver = false;
                this.turnCount = 0;
                this.aiThinking = false;
                document.getElementById('winner-message').textContent = '';
                document.getElementById('ai-thinking').textContent = '';
                this.initBoard();
            }
            
            initSettings() {
                const gameModeSelect = document.getElementById('game-mode');
                const aiDifficultySelect = document.getElementById('ai-difficulty');
                
                gameModeSelect.addEventListener('change', (e) => {
                    this.gameMode = e.target.value;
                    this.restart();
                });
                
                aiDifficultySelect.addEventListener('change', (e) => {
                    this.aiDifficulty = e.target.value;
                });
            }
            
            aiMove() {
                this.aiThinking = true;
                document.getElementById('ai-thinking').textContent = 'AI思考中...';
                
                // 使用setTimeout模拟AI思考时间
                setTimeout(() => {
                    const move = this.getBestMove();
                    if (move) {
                        this.makeMove(move.row, move.col);
                    }
                    this.aiThinking = false;
                    document.getElementById('ai-thinking').textContent = '';
                }, 500);
            }
            
            getBestMove() {
                const emptyCells = [];
                
                for (let row = 0; row < 15; row++) {
                    for (let col = 0; col < 15; col++) {
                        if (this.board[row][col] === null) {
                            emptyCells.push({ row, col });
                        }
                    }
                }
                
                if (emptyCells.length === 0) return null;
                
                // 根据难度选择不同的策略
                switch (this.aiDifficulty) {
                    case 'easy':
                        return this.getRandomMove(emptyCells);
                    case 'medium':
                        return this.getMediumMove(emptyCells);
                    case 'hard':
                        return this.getHardMove(emptyCells);
                    default:
                        return this.getRandomMove(emptyCells);
                }
            }
            
            getRandomMove(emptyCells) {
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            getMediumMove(emptyCells) {
                // 中等难度：50%概率选择最优解，50%随机
                if (Math.random() < 0.5) {
                    return this.getHardMove(emptyCells);
                } else {
                    return this.getRandomMove(emptyCells);
                }
            }
            
            getHardMove(emptyCells) {
                let bestMove = null;
                let bestScore = -Infinity;
                
                for (const { row, col } of emptyCells) {
                    // 检查这一步是否能赢
                    this.board[row][col] = 'white';
                    if (this.checkWin(row, col)) {
                        this.board[row][col] = null;
                        return { row, col };
                    }
                    this.board[row][col] = null;
                    
                    // 检查对手这一步是否能赢，需要防守
                    this.board[row][col] = 'black';
                    if (this.checkWin(row, col)) {
                        this.board[row][col] = null;
                        return { row, col };
                    }
                    this.board[row][col] = null;
                    
                    // 评估这一步的分数
                    const score = this.evaluatePosition(row, col, 'white');
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = { row, col };
                    }
                }
                
                return bestMove || this.getRandomMove(emptyCells);
            }
            
            evaluatePosition(row, col, player) {
                let score = 0;
                const opponent = player === 'white' ? 'black' : 'white';
                
                // 临时放置棋子
                this.board[row][col] = player;
                
                // 评估四个方向
                const directions = [
                    [[0, 1], [0, -1]],  // 水平
                    [[1, 0], [-1, 0]],  // 垂直
                    [[1, 1], [-1, -1]], // 对角线
                    [[1, -1], [-1, 1]]  // 反对角线
                ];
                
                for (const direction of directions) {
                    let count = 1;
                    let openEnds = 0;
                    
                    for (const [dr, dc] of direction) {
                        let r = row + dr;
                        let c = col + dc;
                        let consecutive = 0;
                        
                        while (r >= 0 && r < 15 && c >= 0 && c < 15 && this.board[r][c] === player) {
                            consecutive++;
                            r += dr;
                            c += dc;
                        }
                        
                        count += consecutive;
                        
                        // 检查两端是否开放
                        if (r >= 0 && r < 15 && c >= 0 && c < 15 && this.board[r][c] === null) {
                            openEnds++;
                        }
                    }
                    
                    // 根据连子数和开放端数计算分数
                    if (count >= 5) {
                        score += 100000; // 五连
                    } else if (count === 4) {
                        score += openEnds === 2 ? 10000 : 1000; // 活四或冲四
                    } else if (count === 3) {
                        score += openEnds === 2 ? 1000 : 100; // 活三或眠三
                    } else if (count === 2) {
                        score += openEnds === 2 ? 100 : 10; // 活二或眠二
                    }
                }
                
                // 移除临时棋子
                this.board[row][col] = null;
                
                // 中心位置加分
                const centerDistance = Math.abs(row - 7) + Math.abs(col - 7);
                score += (14 - centerDistance) * 2;
                
                return score;
            }
        }

        // 初始化游戏
        const game = new Gomoku();
        
        // 重新开始按钮事件
        document.getElementById('restart-btn').addEventListener('click', () => {
            game.restart();
        });
    </script>
</body>
</html>
